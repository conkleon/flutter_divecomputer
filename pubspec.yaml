name: dive_computer
description: "A Flutter plugin bridging dive computers (USB/serial, and eventually Bluetooth/BLE) to Flutter apps, built for the Petousis/Nautilus Dive Log app."
version: 0.0.1
homepage: "https://divenote.app"
repository: "https://github.com/DiveNote/dive_computer"
issue_tracker: "https://github.com/DiveNote/dive_computer/issues"
funding: 
 - "https://github.com/sponsors/Sese-Schneider"

environment:
  sdk: '>=3.2.3 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  ffi: '>=2.1.0 <3.0.0'
  flutter:
    sdk: flutter
  logging: '>=1.2.0 <2.0.0'
  path: '>=1.8.0 <2.0.0'
  plugin_platform_interface: '>=2.0.2 <3.0.0'
  universal_ble: '>=1.0.0 <3.0.0'

dev_dependencies:
  fake_async: ">=1.3.3 <2.0.0"
  ffigen: ">=10.0.0 <12.0.0"
  flutter_test:
    sdk: flutter
  flutter_lints: ">=2.0.0 <4.0.0"
  test: ">=1.24.0 <2.0.0"

flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
      android:
        # NOT ffiPlugin here: Flutter's tool omits the GeneratedPluginRegistrant
        # entry for a platform that sets BOTH ffiPlugin:true and pluginClass, so
        # the RFCOMM MethodChannel would have no registered handler. The prebuilt
        # libdivecomputer .so files are bundled via this plugin's own
        # android/build.gradle (jniLibs.srcDirs), independent of ffiPlugin, and
        # DiveComputerFfi loads them with DynamicLibrary.open().
        package: app.divenote.dive_computer
        pluginClass: DiveComputerPlugin
      macos:
        ffiPlugin: true
      ios:
        ffiPlugin: true
        