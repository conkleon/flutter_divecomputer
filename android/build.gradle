// The Android Gradle Plugin builds the native code with the Android NDK.

group 'app.divenote.dive_computer'
version '1.0'

buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'app.divenote.dive_computer'

    // AGP 8 requires compileSdk >= 34; Flutter 3.32 apps compile against 35.
    compileSdk 34

    // Use the NDK version declared in the Flutter app's android/app/build.gradle.
    ndkVersion android.ndkVersion

    sourceSets {
        main {
            // Bundle the prebuilt libdivecomputer .so files into the final apk.
            jniLibs.srcDirs = ['../native/lib/android']
            // Kotlin method-channel plugin source.
            java.srcDirs += 'src/main/kotlin'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        minSdkVersion 21
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
